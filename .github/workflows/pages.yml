# Publishes the browser UI to GitHub Pages: https://ryan-tobin.github.io/blindfold/
# It talks to the enclaves and NEAR directly, so the page itself holds no secrets.
name: ui pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['ui/**', 'datasets/riverside/**', 'docs/bench.json', 'docker-compose.tee.yml', 'docker-compose.mainnet.yml', 'verify/measurements.json', '.github/workflows/pages.yml']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm run build
        working-directory: ui
        env:
          BASE_PATH: /blindfold/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ui/dist
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4