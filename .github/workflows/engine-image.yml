# Builds the engine image that runs in the enclave and pushes it to GHCR,
# with a signed build provenance, so anyone can check the image digest in
# docker-compose.tee.yml was built by this workflow from this repo:
#     gh attestation verify oci://ghcr.io/ryan-tobin/blindfold-engine@sha256:... --repo ryan-tobin/blindfold
name: engine image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      [
        'engine/**',
        'datasets/riverside/**',
        '.github/workflows/engine-image.yml',
      ]

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: engine/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ github.repository_owner }}/blindfold-engine:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/blindfold-engine:latest
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/blindfold-engine
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - run: echo "image ghcr.io/${{ github.repository_owner }}/blindfold-engine@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
