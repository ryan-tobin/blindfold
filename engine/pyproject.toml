[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blindfold"
version = "0.1.0"
description = "Private data room: differentially private answers from encrypted data in a TEE, paid and receipted on NEAR"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "duckdb==2.0.0",
    "fastapi==0.143.3",
    "pydantic==2.13.5",
    "starlette==1.8.0",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = [
    "httpx2==2.13.1",
    "pytest==9.2.0",
]

[tool.setuptools]
packages = ["blindfold"]

[tool.pytest.ini_options]
testpaths = ["tests"]