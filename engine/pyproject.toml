[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"

[project]
name="blindfold"
version="0.1.0"
description="Private data room: differentially private answers from encrypted data in a TEE, paid and receipted on NEAR."
license= { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "duckdb==2.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0"
]

[tool.setuptools]
packages = ["blindfold"]

[tool.pytest.ini_options]
testpaths = ["tests"]